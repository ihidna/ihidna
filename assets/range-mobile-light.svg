<svg xmlns="http://www.w3.org/2000/svg" width="600" height="650" viewBox="0 0 600 650" role="img" aria-labelledby="title desc">
  <title id="title">Selected systems</title>
  <desc id="desc">Armyt Studio, Jarvis, and YTBot described as useful transformations.</desc>
  <g font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#656D76">
    <text x="24" y="38">SELECTED SYSTEMS / 03</text><text x="576" y="38" text-anchor="end">RECENT</text>
  </g>
  <path d="M24 54H576M48 88V530" stroke="#D0D7DE" stroke-width="1"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1F2328">
    <g transform="translate(0 98)">
      <circle cx="48" cy="0" r="7" fill="#9A6A00"/><text x="82" y="-1" font-size="12" font-weight="700">01</text><text x="82" y="34" font-size="27" font-weight="700">ARMYT STUDIO</text>
      <text x="82" y="67" font-size="16">brief  &gt;  working digital presence</text><text x="82" y="98" font-size="13" fill="#656D76">Studio platform, CMS, and operations.</text>
      <text x="82" y="126" font-family="Consolas, 'Courier New', monospace" font-size="12">REACT / PHP / MYSQL</text>
    </g>
    <path d="M82 245H576" stroke="#D0D7DE" stroke-width="1"/>
    <g transform="translate(0 270)">
      <circle cx="48" cy="0" r="7" fill="#8C959F"/><text x="82" y="-1" font-size="12" font-weight="700">02</text><text x="82" y="34" font-size="27" font-weight="700">JARVIS</text>
      <text x="82" y="67" font-size="16">voice  &gt;  safe phone action</text><text x="82" y="98" font-size="13" fill="#656D76">Observes, decides, acts, and asks.</text>
      <text x="82" y="126" font-family="Consolas, 'Courier New', monospace" font-size="12">FLUTTER / KOTLIN</text>
    </g>
    <path d="M82 417H576" stroke="#D0D7DE" stroke-width="1"/>
    <g transform="translate(0 442)">
      <circle cx="48" cy="0" r="7" fill="#8C959F"/><text x="82" y="-1" font-size="12" font-weight="700">03</text><text x="82" y="34" font-size="27" font-weight="700">YTBOT</text>
      <text x="82" y="67" font-size="16">weak signal  &gt;  reviewed video</text><text x="82" y="98" font-size="13" fill="#656D76">Research, script, render, approve.</text>
      <text x="82" y="126" font-family="Consolas, 'Courier New', monospace" font-size="12">PYTHON / FFMPEG</text>
    </g>
  </g>
  <path d="M24 590H576" stroke="#D0D7DE" stroke-width="1"/>
  <text x="24" y="626" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" fill="#1F2328">Make complexity usable.</text>
</svg>

