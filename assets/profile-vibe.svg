<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Kadyr — Full-Stack Developer">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090b13"/><stop offset=".48" stop-color="#11162b"/><stop offset="1" stop-color="#0a101b"/></linearGradient>
  <radialGradient id="a"><stop stop-color="#9d7cff" stop-opacity=".55"/><stop offset="1" stop-color="#9d7cff" stop-opacity="0"/></radialGradient>
  <radialGradient id="b"><stop stop-color="#5eead4" stop-opacity=".42"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="8" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.muted{fill:#929bb0}.line{stroke:#ffffff;stroke-opacity:.08}.orb1{animation:f1 9s ease-in-out infinite alternate}.orb2{animation:f2 11s ease-in-out infinite alternate}.pulse{animation:p 3.2s ease-in-out infinite}.dash{stroke-dasharray:7 12;animation:d 18s linear infinite}.blink{animation:k 1.1s steps(1) infinite}@keyframes f1{to{transform:translate(90px,45px) scale(1.12)}}@keyframes f2{to{transform:translate(-70px,-35px) scale(.9)}}@keyframes p{50%{opacity:.35}}@keyframes d{to{stroke-dashoffset:-380}}@keyframes k{50%{opacity:0}}
  </style>
</defs>
<rect width="1200" height="720" rx="36" fill="url(#bg)"/>
<circle class="orb1" cx="205" cy="125" r="250" fill="url(#a)" filter="url(#blur)"/><circle class="orb2" cx="1040" cy="610" r="280" fill="url(#b)" filter="url(#blur)"/>
<path class="line dash" d="M55 552 C240 430 320 690 520 555 S840 445 1145 550" fill="none"/>
<g transform="translate(70 62)"><circle cx="8" cy="8" r="6" fill="#5eead4" filter="url(#glow)" class="pulse"/><text x="28" y="14" class="mono" font-size="14" letter-spacing="2" fill="#aab3c7">AVAILABLE / BUILDING</text></g>
<g class="sans"><text x="70" y="205" font-size="82" font-weight="750" letter-spacing="-4" fill="#f6f7fb">KADYR</text><text x="70" y="265" font-size="26" font-weight="500" fill="#b9c0d0">Full-Stack Developer</text><text x="70" y="316" font-size="18" class="muted">I build products where interface, logic and automation</text><text x="70" y="344" font-size="18" class="muted">feel like one quiet, well-tuned system.</text></g>
<g transform="translate(70 402)"><rect width="465" height="92" rx="22" fill="#ffffff" fill-opacity=".055" stroke="#ffffff" stroke-opacity=".10"/><text x="25" y="31" class="mono" font-size="13" fill="#7f89a2">CURRENT SIGNAL</text><text x="25" y="62" class="sans" font-size="18" fill="#e8ebf3">design → code → ship → refine</text><rect x="301" y="47" width="9" height="20" rx="2" fill="#5eead4" class="blink"/></g>
<g transform="translate(650 112)"><rect width="480" height="365" rx="30" fill="#080b13" fill-opacity=".64" stroke="#ffffff" stroke-opacity=".10"/><circle cx="29" cy="28" r="5" fill="#ff7b72"/><circle cx="48" cy="28" r="5" fill="#e3b341"/><circle cx="67" cy="28" r="5" fill="#3fb950"/><text x="30" y="83" class="mono" font-size="15" fill="#778199">~/ihidna</text><text x="30" y="123" class="mono" font-size="16" fill="#c9d1e0"><tspan fill="#9d7cff">const</tspan> developer = {</text><text x="52" y="160" class="mono" font-size="16" fill="#c9d1e0">focus: <tspan fill="#5eead4">"full-stack"</tspan>,</text><text x="52" y="197" class="mono" font-size="16" fill="#c9d1e0">craft: <tspan fill="#5eead4">"product systems"</tspan>,</text><text x="52" y="234" class="mono" font-size="16" fill="#c9d1e0">mode: <tspan fill="#5eead4">"shipping"</tspan></text><text x="30" y="271" class="mono" font-size="16" fill="#c9d1e0">}</text><text x="30" y="325" class="mono" font-size="15" fill="#69738a">// soft pixels. hard logic.</text></g>
<g transform="translate(70 625)" class="mono" font-size="13"><text fill="#69738a">STACK /</text><text x="75" fill="#b9c0d0">TypeScript · React · Node · APIs · Databases · Automation</text></g>
<g transform="translate(930 646)"><text class="mono" font-size="13" fill="#69738a">IHIDNA / 2026</text></g>
</svg>