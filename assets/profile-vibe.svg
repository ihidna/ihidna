<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="Kadyr — Full-Stack Developer">
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6f1e8"/><stop offset="1" stop-color="#ebe4d8"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-opacity=".09"/></filter>
 <style>.s{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.float{animation:f 6s ease-in-out infinite}.float2{animation:g 8s ease-in-out infinite}.dash{stroke-dasharray:5 10;animation:d 18s linear infinite}.blink{animation:b 1.2s steps(1) infinite}@keyframes f{50%{transform:translateY(-7px) rotate(-.3deg)}}@keyframes g{50%{transform:translateY(6px) rotate(.4deg)}}@keyframes d{to{stroke-dashoffset:-240}}@keyframes b{50%{opacity:.15}}</style>
</defs>
<rect width="1200" height="620" rx="34" fill="url(#paper)"/>
<path d="M0 470 C240 405 360 535 600 465 S940 420 1200 485V620H0Z" fill="#ded5c7" opacity=".55"/>
<path class="dash" d="M55 505 C240 430 350 550 555 475 S895 410 1140 485" fill="none" stroke="#b6aa9b" stroke-width="1.5"/>
<g transform="translate(68 60)"><circle cx="7" cy="7" r="6" fill="#d96c4a"/><text x="27" y="12" class="m" font-size="13" letter-spacing="2" fill="#756c62">BUILDING WITH INTENT</text></g>
<g class="s"><text x="68" y="195" font-size="84" font-weight="760" letter-spacing="-4" fill="#25211e">KADYR</text><text x="68" y="252" font-size="25" font-weight="600" fill="#3c3732">Full-Stack Developer</text><text x="68" y="306" font-size="19" fill="#6c645c">I turn rough ideas into working products.</text><text x="68" y="338" font-size="19" fill="#6c645c">AI is part of my workflow — not the final decision.</text></g>
<g transform="translate(68 392)" class="float"><rect width="425" height="93" rx="18" fill="#fffdf8" stroke="#d8cec0" filter="url(#shadow)"/><text x="24" y="30" class="m" font-size="12" fill="#a0968b">MY LOOP</text><text x="24" y="62" class="s" font-size="18" fill="#302b27">think → prompt → build → test → polish</text><rect x="356" y="47" width="8" height="18" rx="2" fill="#d96c4a" class="blink"/></g>
<g transform="translate(650 88)" class="float2"><rect width="470" height="350" rx="24" fill="#2a2724" filter="url(#shadow)"/><rect x="24" y="24" width="422" height="302" rx="15" fill="#302d29" stroke="#4b4640"/><text x="48" y="65" class="m" font-size="12" fill="#a99f94">WORKFLOW / 01</text><text x="48" y="112" class="s" font-size="23" font-weight="650" fill="#f3ede4">Human direction.</text><text x="48" y="145" class="s" font-size="23" font-weight="650" fill="#f3ede4">AI acceleration.</text><text x="48" y="178" class="s" font-size="23" font-weight="650" fill="#f3ede4">Code that ships.</text><line x1="48" y1="211" x2="398" y2="211" stroke="#5a534c"/><text x="48" y="246" class="m" font-size="13" fill="#d68a6f">01</text><text x="88" y="246" class="m" font-size="13" fill="#bdb3a8">understand the problem</text><text x="48" y="276" class="m" font-size="13" fill="#d68a6f">02</text><text x="88" y="276" class="m" font-size="13" fill="#bdb3a8">use AI to move faster</text><text x="48" y="306" class="m" font-size="13" fill="#d68a6f">03</text><text x="88" y="306" class="m" font-size="13" fill="#bdb3a8">review every important choice</text></g>
<g transform="translate(690 466) rotate(2)" class="float"><rect width="344" height="82" rx="10" fill="#d96c4a" filter="url(#shadow)"/><text x="22" y="31" class="m" font-size="12" fill="#fbeee8">NOTE TO SELF</text><text x="22" y="57" class="s" font-size="16" font-weight="600" fill="#fffaf5">make it useful before making it clever.</text></g>
<text x="68" y="570" class="m" font-size="12" fill="#91877c">FULL-STACK · AI-ASSISTED WORKFLOW · PRODUCT THINKING</text><text x="1040" y="570" class="m" font-size="12" fill="#91877c">IHIDNA</text>
</svg>